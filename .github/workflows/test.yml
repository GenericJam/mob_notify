name: tests

# CI for the plugin's host-side Elixir surface — the same gate mob core runs,
# so a PR gets a green check instead of relying only on each contributor's
# local pre-push hook. Native code (zig/ObjC) is compiled by the host app at
# deploy time, not here. The Kotlin bridge is compiled and its envelope
# builder run by the :kotlin_host tests (kotlinc and the Android SDK come with
# the runner image; org.json is fetched below).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.19'
            otp: '28'
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps + _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix compile --warnings-as-errors

      - name: Format check
        run: mix format --check-formatted

      - name: Credo (strict)
        run: mix credo --strict

      - name: org.json for the :kotlin_host tests
        run: |
          curl -fsSL -o "$RUNNER_TEMP/json-20231013.jar" \
            https://repo1.maven.org/maven2/org/json/json/20231013/json-20231013.jar
          echo "MOB_NOTIFY_ORG_JSON_JAR=$RUNNER_TEMP/json-20231013.jar" >> "$GITHUB_ENV"

      - name: Tests
        env:
          # Fail instead of silently excluding :kotlin_host when the toolchain
          # is missing.
          MOB_NOTIFY_REQUIRE_KOTLIN_HOST: "1"
        run: mix test --exclude macos_only --exclude requires_zig
